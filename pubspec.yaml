name: user_interface
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # YOLO + QR 解碼 + 影像裁切
  tflite_flutter: ^0.12.1
  google_mlkit_barcode_scanning: ^0.14.2
  image: ^4.8.0

  # 大富翁地圖搖一搖功能
  sensors_plus: ^6.1.0

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  intl: ^0.19.0
  dio: ^5.9.0
  path: ^1.9.1
  image_picker: ^1.2.1
  mobile_scanner: ^6.0.11
  google_mlkit_text_recognition: ^0.15.0
  shared_preferences: ^2.5.3
  camera: ^0.11.3
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # SQLite
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  http: ^1.2.2  # 傳送 API 用
  http_parser: ^4.0.2

  # 🔥🔥🔥 新增：檔案選擇器 (為了上傳 CSV) 🔥🔥🔥
  file_picker: ^8.0.0

  # 語音相關套件
  record: ^5.2.0        # 錄音用
  permission_handler: ^11.3.1

  # 音效與動畫
  audioplayers: ^6.0.0
  lottie: ^3.1.2

  # QR Code 產生
  qr_flutter: ^4.1.0

  # 🔥🔥🔥 新增：Firebase 登入 (Google / Email 密碼) 🔥🔥🔥
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  google_sign_in: ^7.1.1
  flutter_line_sdk: ^2.4.1  # ★ 新增：LINE 登入

  #自動生成分享圖
  fl_chart: ^1.0.0
  gal: ^2.3.2
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/expense.db
    - assets/yolov9t_invoice_float32.tflite
    - assets/sounds/
    - assets/animations/
    - assets/images/
    - assets/iso/

dependency_overrides:
  record_linux: ^1.3.0
  record_platform_interface: ^1.5.0